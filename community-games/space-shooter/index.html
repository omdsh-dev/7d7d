<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太空射击</title>
<style>
  html, body { margin: 0; height: 100%; background: #101322; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #bar { color: #e8e9f2; font-size: 18px; width: 480px; display: flex; justify-content: space-between; max-width: 92vw; }
  #bar b { color: #ff7f27; }
  canvas { background: #05060d; border-radius: 14px; width: min(92vw, 480px); height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #msg { color: #8b90a8; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar"><span>🚀 太空射击</span><span>得分 <b id="score">0</b></span><span>生命 <b id="lives">3</b></span></div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div id="msg">方向键 / WASD 移动，空格射击</div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 480, H = 480;
  const ship = { x: W / 2, y: H - 60, r: 14 };
  let bullets = [], rocks = [], stars = [];
  let score = 0, lives = 3, over = false, running = false, lastShoot = 0, spawnTimer = 0;
  let keys = {};

  for (let i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3 });
  }

  function reset() {
    score = 0; lives = 3; over = false;
    bullets = []; rocks = [];
    document.getElementById('score').textContent = '0';
    document.getElementById('lives').textContent = '3';
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ') {
      e.preventDefault();
      if (over) { reset(); return; }
      running = true;
      keys.space = true;
      return;
    }
    keys[k] = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  function spawnRock() {
    const size = 14 + Math.random() * 18;
    rocks.push({
      x: Math.random() * W,
      y: -30,
      r: size,
      vx: (Math.random() - 0.5) * 1.6,
      vy: 1.2 + Math.random() * 1.6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.05,
    });
  }

  function update(dt) {
    if (over || !running) return;
    const speed = 240 * dt;
    if (keys.arrowleft || keys.a) ship.x -= speed;
    if (keys.arrowright || keys.d) ship.x += speed;
    if (keys.arrowup || keys.w) ship.y -= speed;
    if (keys.arrowdown || keys.s) ship.y += speed;
    ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x));
    ship.y = Math.max(ship.r, Math.min(H - ship.r, ship.y));

    if (keys.space && performance.now() - lastShoot > 220) {
      lastShoot = performance.now();
      bullets.push({ x: ship.x, y: ship.y - ship.r, vy: -460 });
    }

    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter((b) => b.y > -20);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnRock();
      spawnTimer = Math.max(0.45, 1.4 - score * 0.004);
    }
    for (const r of rocks) {
      r.x += r.vx; r.y += r.vy; r.rot += r.vr;
      if (r.x < -40) r.x = W + 40;
      if (r.x > W + 40) r.x = -40;
    }

    // 子弹 × 小行星
    for (const b of bullets) {
      for (let i = rocks.length - 1; i >= 0; i--) {
        const r = rocks[i];
        const dx = b.x - r.x, dy = b.y - r.y;
        if (dx * dx + dy * dy < (r.r + 4) * (r.r + 4)) {
          rocks.splice(i, 1);
          score += 10;
          document.getElementById('score').textContent = String(score);
        }
      }
    }
    // 飞船 × 小行星
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      const dx = ship.x - r.x, dy = ship.y - r.y;
      if (dx * dx + dy * dy < (r.r + ship.r) * (r.r + ship.r)) {
        rocks.splice(i, 1);
        lives -= 1;
        document.getElementById('lives').textContent = String(lives);
        if (lives <= 0) { over = true; running = false; }
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#9aa0c0';
    for (const s of stars) { ctx.fillRect(s.x, s.y, s.s, s.s); }
    for (const b of bullets) {
      ctx.fillStyle = '#40c4ff';
      ctx.fillRect(b.x - 2, b.y - 7, 4, 14);
    }
    for (const r of rocks) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      ctx.fillStyle = '#8d6e63';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const rad = r.r * (i % 2 === 0 ? 1 : 0.75);
        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // 飞船
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.fillStyle = '#ff7f27';
    ctx.beginPath();
    ctx.moveTo(0, -ship.r);
    ctx.lineTo(ship.r * 0.8, ship.r * 0.9);
    ctx.lineTo(0, ship.r * 0.45);
    ctx.lineTo(-ship.r * 0.8, ship.r * 0.9);
    ctx.closePath();
    ctx.fill();
    if (running && !over && Math.floor(now / 90) % 2 === 0) {
      ctx.fillStyle = '#69f0ae';
      ctx.beginPath();
      ctx.moveTo(-5, ship.r * 0.5); ctx.lineTo(5, ship.r * 0.5); ctx.lineTo(0, ship.r * 1.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束', W / 2, H / 2 - 10);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#ff7f27';
      ctx.fillText('得分 ' + score + '，空格再来一局', W / 2, H / 2 + 28);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('msg').textContent = '方向键 / WASD 移动，空格射击';
})();
</script>
</body>
</html>
