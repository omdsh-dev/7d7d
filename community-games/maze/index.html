<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷宫</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1e2e; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #bar { color: #e8e9f2; font-size: 18px; width: 480px; display: flex; justify-content: space-between; max-width: 92vw; }
  #bar b { color: #ff7f27; }
  canvas { background: #101322; border-radius: 14px; width: min(92vw, 480px); height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #msg { color: #8b90a8; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar"><span>🌀 迷宫</span><span>步数 <b id="steps">0</b></span><span>Space 换一关</span></div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div id="msg">方向键 / WASD 移动，走到 🚩 出口</div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const SIZE = 480, N = 13;
  const CELL = SIZE / N;
  // 每个格子记录四边墙：上右下左
  let walls = [], player = { x: 0, y: 0 }, exit = { x: N - 1, y: N - 1 };
  let steps = 0, won = false;

  function reset() {
    walls = Array.from({ length: N }, () => Array.from({ length: N }, () => [true, true, true, true]));
    generate(0, 0);
    // 打开入口和出口的墙
    walls[0][0][3] = false;
    walls[N - 1][N - 1][1] = false;
    player = { x: 0, y: 0 };
    steps = 0; won = false;
    document.getElementById('steps').textContent = '0';
    document.getElementById('msg').textContent = '方向键 / WASD 移动，走到 🚩 出口';
  }

  // 递归回溯迷宫生成
  function generate(x, y) {
    const dirs = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
    const order = [...dirs].sort(() => Math.random() - 0.5);
    for (const [dx, dy, wallIdx, opposite] of order) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;
      if (walls[ny][nx].every(w => w)) {
        walls[y][x][wallIdx] = false;
        walls[ny][nx][opposite] = false;
        generate(nx, ny);
      }
    }
  }

  function move(dx, dy) {
    if (won) return;
    // 0=上 1=右 2=下 3=左
    const wallIdx = dy === -1 ? 0 : dx === 1 ? 1 : dy === 1 ? 2 : 3;
    if (walls[player.y][player.x][wallIdx]) return;
    player.x += dx; player.y += dy;
    steps += 1;
    document.getElementById('steps').textContent = String(steps);
    if (player.x === exit.x && player.y === exit.y) {
      won = true;
      document.getElementById('msg').textContent = '走出迷宫！用了 ' + steps + ' 步，Space 换一关';
    }
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); reset(); return; }
    const d = k === 'arrowup' || k === 'w' ? [0, -1] : k === 'arrowdown' || k === 's' ? [0, 1]
      : k === 'arrowleft' || k === 'a' ? [-1, 0] : k === 'arrowright' || k === 'd' ? [1, 0] : null;
    if (d === null) return;
    e.preventDefault();
    move(d[0], d[1]);
  });

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = '#8b90a8'; ctx.lineWidth = 3;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const w = walls[y][x];
      const px = x * CELL, py = y * CELL;
      if (w[0]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + CELL, py); ctx.stroke(); }
      if (w[1]) { ctx.beginPath(); ctx.moveTo(px + CELL, py); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
      if (w[2]) { ctx.beginPath(); ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
      if (w[3]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + CELL); ctx.stroke(); }
    }
    ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🚩', exit.x * CELL + CELL / 2, exit.y * CELL + CELL / 2 + 1);
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.arc(player.x * CELL + CELL / 2, player.y * CELL + CELL / 2, CELL * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.x * CELL + CELL / 2 - 3, player.y * CELL + CELL / 2 - 3, 2.5, 0, Math.PI * 2);
    ctx.arc(player.x * CELL + CELL / 2 + 3, player.y * CELL + CELL / 2 - 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
    requestAnimationFrame(draw);
  }

  reset(); draw();
})();
</script>
</body>
</html>
